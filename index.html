<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台股進階策略選股搜尋器</title>
    <!-- 引入 Tailwind CSS 讓介面簡潔美觀 -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- 標題與更新時間 -->
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b border-gray-800 pb-4">
            <div>
                <h1 class="text-3xl font-bold tracking-wider text-emerald-400">📈 台股智慧選股策略</h1>
                <p class="text-sm text-gray-400 mt-1">策略：47天K突破 + 3天K底底高 + 3天K紅吞噬</p>
            </div>
            <div id="update-time" class="text-sm text-gray-400 mt-2 md:mt-0 bg-gray-800 px-4 py-2 rounded-lg">
                資料更新中...
            </div>
        </div>

        <!-- 數據統計卡片 -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
            <div class="bg-gray-800 p-4 rounded-xl border border-gray-700">
                <p class="text-sm text-gray-400">符合條件總檔數</p>
                <p id="total-count" class="text-2xl font-bold text-white mt-1">-</p>
            </div>
        </div>

        <!-- 股票列表表格 -->
        <div class="bg-gray-800 rounded-xl shadow-lg overflow-hidden border border-gray-700">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-700 text-gray-300 text-sm uppercase tracking-wider">
                            <th class="p-4">狀態/警告</th>
                            <th class="p-4">代號 / 名稱</th>
                            <th class="p-4">收盤價</th>
                            <th class="p-4">漲跌幅</th>
                            <th class="p-4">成交量</th>
                            <th class="p-4 text-emerald-400 font-semibold">建議進場價 (紅吞收盤)</th>
                            <th class="p-4 text-rose-400 font-semibold">建議出場/停損價 (紅吞最低)</th>
                        </tr>
                    </thead>
                    <tbody id="stock-table-body" class="divide-y divide-gray-700 text-sm">
                        <!-- 動態載入資料 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- JavaScript 讀取 data.json -->
    <script>
        async function loadStockData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('無法讀取數據檔案');
                
                const data = await response.json();
                
                document.getElementById('update-time').innerText = `最後更新時間：${data.updated_at}`; document.getElementById('total-count').innerText = `${data.total_count} 檔`;

                const tbody = document.getElementById('stock-table-body');
                tbody.innerHTML = '';

                if (data.stocks.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-6 text-center text-gray-400">今日沒有符合所有嚴格篩選條件的股票</td></tr>`;
                    return;
                }

                data.stocks.forEach(stock => {
                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-750 transition-colors";

                    const changeColor = stock.change_pct >= 0 ? 'text-rose-400' : 'text-emerald-400';
                    const changeSign = stock.change_pct >= 0 ? '+' : '';

                    const warningHtml = stock.has_warning 
                        ? `<span class="bg-rose-500/20 text-rose-400 px-2 py-1 rounded text-xs font-bold border
